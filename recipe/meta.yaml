{% set name = "hydra-core" %}
{% set version = "1.3.5" %}
{% set antlr_version = "4.9.3" %}

package:
  name: {{ name|lower }}
  version: {{ version }}

source:
  - url: https://pypi.org/packages/source/{{ name[0] }}/{{ name }}/{{ name.replace('-', '_') }}-{{ version }}.tar.gz
    sha256: 71c441eabbde086062045e4d3fce9e26015244f1a4ac721cf3e444c7edf10633
    patches:
      - patches/0000-unvendor_antlr.patch
  - url: https://github.com/facebookresearch/hydra/archive/refs/tags/v{{ version }}.tar.gz
    sha256: 38f9ae3729a6ea7b5a2f6c6e33d42ccc8bb10637587897503815eae60e2bdd95
    folder: test-assets

build:
  number: 0
  script: {{ PYTHON }} -m pip install . --no-deps --no-build-isolation -vv
  # skipping python 314 and newer because of incompatibility
  skip: true  # [py<310 and py>313]
  script_env:
    # this environment variable is used in the antlr-*-complete.jar string inside the
    # patch to correctly unvendor antlr and use the antlr package from conda
    - ANTLR_VERSION={{ antlr_version }}

requirements:
  host:
    - antlr =={{ antlr_version }}
    - python
    - pip
    - openjdk
    - wheel
    - setuptools
  run:
    - python
    - omegaconf >=2.2,<2.4
    - antlr4-python3-runtime =={{ antlr_version }}
    - packaging
    - importlib_resources  # [py<39]

# list tests to be skipped
{% set tests_to_skip = "--deselect=tests/test_hydra.py::test_app_with_error_exception_sanitized" %}
{% set tests_to_skip_313 = [
  "--deselect=tests/test_hydra.py::test_hydra_deprecation_warning[deprecation_error]",
  "--deselect=tests/test_utils.py::TestRunAndReport::test_failure[strip_omegaconf_from_bottom_of_stack]"
] %}
{% set tests_to_skip_win = [
  "--deselect=tests/test_compose.py::test_missing_bad_config_dir_error",
  "--deselect=tests/test_hydra.py::test_app_with_unicode_config",
  "--deselect=tests/instantiate/test_instantiate.py::test_allowlist_works_for_canonical_os_alias",
  "--deselect=tests/test_hydra.py::test_missing_conf_file",
  "--deselect=tests/test_hydra.py::test_app_without_config___no_overrides",
  "--deselect=tests/test_hydra.py::test_hydra_main_rerun",
  "--deselect=tests/test_hydra.py::test_app_without_config__with_append",
  "--deselect=tests/test_hydra.py::test_app_with_config_file__no_overrides",
  "--deselect=tests/test_hydra.py::test_app_with_config_file__with_override",
  "--deselect=tests/test_hydra.py::test_app_with_config_file__with_decorators",
  "--deselect=tests/test_hydra.py::test_app_with_split_config",
  "--deselect=tests/test_hydra.py::test_app_with_config_groups__override_dataset__wrong",
  "--deselect=tests/test_hydra.py::test_app_with_config_groups__override_all_configs",
  "--deselect=tests/test_hydra.py::test_app_with_sweep_cfg__override_to_basic_launcher",
  "--deselect=tests/test_hydra.py::test_interpolating_dir_hydra_to_app",
  "--deselect=tests/test_hydra.py::test_override_with_invalid_group_choice",
  "--deselect=tests/test_hydra.py::test_hydra_output_dir",
  "--deselect=tests/test_hydra.py::TestTaskRunnerLogging::test_1",
  "--deselect=tests/instantiate/test_instantiate.py::test_allowlist_works_for_canonical_os_alias",
  "--deselect=tests/test_examples/test_patterns.py::test_specializing_config_example",
  "--deselect=tests/test_examples/test_tutorials_basic.py::test_composition_config_example"
] %}
test:
  imports:
    - hydra
  requires:
    - pytest <8
    - pip
  source_files:
    - test-assets/tests
    - test-assets/examples
    - test-assets/hydra/test_utils
    - test-assets/ATTRIBUTION
    - test-assets/pytest.ini
  commands:
    - pip check
    - cd test-assets/tests
    - pytest -vv -W ignore::DeprecationWarning . {{ tests_to_skip }} # [unix and py<313]
    - pytest -vv -W ignore::DeprecationWarning . {{ tests_to_skip }} {{ tests_to_skip_313 | join(' ') }} # [unix and py313]
    - pytest -vv -W ignore::DeprecationWarning . {{ tests_to_skip }} {{ tests_to_skip_win | join(' ') }} # [win and py<313]
    - pytest -vv -W ignore::DeprecationWarning . {{ tests_to_skip }} {{ tests_to_skip_313 | join(' ') }}  {{ tests_to_skip_win | join(' ') }} # [win and py313]

about:
  home: https://hydra.cc
  license: MIT
  license_family: MIT
  license_file: LICENSE
  summary: A framework for elegantly configuring complex applications
  description: |
    Hydra is an open-source Python framework that simplifies the development of research and other complex
    applications. The key feature is the ability to dynamically create a hierarchical configuration by composition and
    override it through config files and the command line. The name Hydra comes from its ability to run multiple
    similar jobs - much like a Hydra with multiple heads.
  doc_url: https://hydra.cc/docs/intro
  dev_url: https://github.com/facebookresearch/hydra

extra:
  recipe-maintainers:
    - mdraw
    - benjaminrwilson
